name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check.sh
      - name: shellcheck, at its strictest default level (see .shellcheckrc)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
  coverage:
    # Statement coverage of the skills' scripts while check.sh runs. kcov isn't in Ubuntu's apt.
    runs-on: ubuntu-latest
    container: kcov/kcov@sha256:481289ae32e55e5b733019515acd10948a4f76dfed381765577db909664fc603 # v43
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq curl python3 rsync gh shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: statement coverage, at least 80%
        run: bash scripts/coverage.sh 80
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # shortcut: checks a Signed-off-by line exists, not that it matches the author. Use a DCO app if that matters.
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' ||
              { echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line"; missing=1; }
          done
          exit $missing
