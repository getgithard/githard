# A githard--v* tag (made with `claude plugin tag --push`) builds a draft release:
# the source as a tarball, SHA256SUMS, and a build attestation for both. Someone checks it with
# skills/releases/verify-release.sh and publishes it. Nothing here publishes.
name: Release
on:
  push:
    tags: ["githard--v*"]
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the draft release
      id-token: write        # sign the build provenance
      attestations: write    # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check.sh
      - name: Tag matches plugin.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "githard--v$(jq -r .version .claude-plugin/plugin.json)" = "$TAG" || { echo "plugin.json doesn't match $TAG"; exit 1; }
      - name: Source tarball and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="$TAG/" -o "dist/$TAG.tar.gz" "$TAG"
          (cd dist && sha256sum ./*.tar.gz | sed 's#\./##' > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Keeps the running draft's notes if there is one.
        run: |
          notes=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --notes "${notes:-Release notes go here.}"
